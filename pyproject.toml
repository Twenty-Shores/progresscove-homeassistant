# Lint config only: this ships as a Home Assistant custom component, not a package.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B904 (re-raising inside an except without `from`) is here because nothing else sees it: the
# pattern binds no name, so F841 has nothing to flag, and the original traceback is discarded.
select = ["E", "F", "C90", "W", "B904", "I"]

[tool.ruff.lint.isort]
# Home Assistant's own import layout, so a file reads the same here as in core.
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 10
